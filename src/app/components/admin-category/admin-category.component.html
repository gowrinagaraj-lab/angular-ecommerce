<div style="max-width: 800px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  <h2 style="margin-bottom: 1.5rem; color: #2c3e50; font-family: sans-serif;">
    {{ editingCategoryId ? 'Edit Category' : 'Create Category' }}
  </h2>

  <div *ngIf="successMessage" style="padding: 1rem; margin-bottom: 1rem; background-color: #d4edda; color: #155724; border-radius: 4px;">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" style="padding: 1rem; margin-bottom: 1rem; background-color: #f8d7da; color: #721c24; border-radius: 4px;">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" #categoryForm="ngForm" style="margin-bottom: 3rem;">
    <div style="margin-bottom: 1rem;">
      <label for="categoryName" style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: #333;">Category Name</label>
      <input type="text" id="categoryName" name="categoryName" [(ngModel)]="categoryName" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" placeholder="Enter category name" />
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label for="categoryDescription" style="display: block; margin-bottom: 0.5rem; font-weight: bold; color: #333;">Description (Optional)</label>
      <textarea id="categoryDescription" name="categoryDescription" [(ngModel)]="categoryDescription" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; min-height: 100px;" placeholder="Enter category description"></textarea>
    </div>

    <div style="display: flex; gap: 1rem;">
      <button type="submit" [disabled]="isSubmitting || categoryForm.invalid" style="flex: 1; padding: 0.75rem; background-color: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; transition: background-color 0.3s;" [style.opacity]="isSubmitting || categoryForm.invalid ? 0.7 : 1">
        {{ isSubmitting ? 'Saving...' : (editingCategoryId ? 'Update Category' : 'Create Category') }}
      </button>
      
      <button *ngIf="editingCategoryId" type="button" (click)="cancelEdit()" style="flex: 1; padding: 0.75rem; background-color: #95a5a6; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;">
        Cancel
      </button>
    </div>
  </form>

  <h3 style="margin-bottom: 1rem; color: #2c3e50; font-family: sans-serif;">Existing Categories</h3>
  
  <div *ngIf="categories.length === 0" style="padding: 1rem; background-color: #f8f9fa; border-radius: 4px; text-align: center; color: #6c757d;">
    No categories found.
  </div>

  <table *ngIf="categories.length > 0" style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
    <thead>
      <tr style="background-color: #f8f9fa; border-bottom: 2px solid #dee2e6;">
        <th style="padding: 1rem; text-align: left; font-weight: bold; color: #495057;">Name</th>
        <th style="padding: 1rem; text-align: left; font-weight: bold; color: #495057;">Description</th>
        <th style="padding: 1rem; text-align: right; font-weight: bold; color: #495057;">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categories" style="border-bottom: 1px solid #dee2e6; transition: background-color 0.2s;" [style.background-color]="category._id === editingCategoryId ? '#f1f8ff' : 'transparent'">
        <td style="padding: 1rem; vertical-align: middle;">{{ category.name }}</td>
        <td style="padding: 1rem; vertical-align: middle; color: #6c757d;">{{ category.description || '-' }}</td>
        <td style="padding: 1rem; vertical-align: middle; text-align: right;">
          <button (click)="editCategory(category)" style="padding: 0.4rem 0.8rem; margin-right: 0.5rem; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">Edit</button>
          <button (click)="deleteCategory(category._id)" style="padding: 0.4rem 0.8rem; background-color: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
