<div class="container mx-auto p-4 max-w-6xl mt-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Sign-In Activity</h1>
  </div>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
    {{ error }}
  </div>

  <!-- Admin Filters -->
  <div *ngIf="isAdmin" class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap gap-4 items-end">
    <div class="flex-1 min-w-[200px]">
      <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Email</label>
      <input pInputText type="email" [(ngModel)]="filterEmail" (keyup.enter)="onFilterChange()" placeholder="user@example.com" class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
    </div>
    <div class="flex-1 min-w-[200px]">
      <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Status</label>
      <div class="w-full">
        <p-dropdown [options]="statusOptions" [(ngModel)]="filterStatus" (onChange)="onFilterChange()" styleClass="w-full" optionLabel="label" optionValue="value"></p-dropdown>
      </div>
    </div>
    <div>
      <p-button label="Filter" (onClick)="onFilterChange()"></p-button>
    </div>
  </div>

  <!-- PrimeNG Data Table -->
  <div class="bg-white rounded-lg shadow overflow-hidden">
    <p-table 
      [value]="activities" 
      [lazy]="true" 
      (onLazyLoad)="loadData($event)" 
      dataKey="_id"
      [tableStyle]="{'min-width': '50rem'}"
      [paginator]="true" 
      [rows]="limit" 
      [totalRecords]="totalRecords" 
      [loading]="loading"
      [rowsPerPageOptions]="[5, 10, 20]"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [showCurrentPageReport]="true">
      
      <ng-template pTemplate="header">
        <tr>
          <th>Date & Time</th>
          <th *ngIf="isAdmin">Email</th>
          <th>Status</th>
          <th>IP Address</th>
          <th>Reason (if failed)</th>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="body" let-activity>
        <tr>
          <td>{{ activity.createdAt | date:'medium' }}</td>
          <td *ngIf="isAdmin">
            <div class="font-medium text-gray-900">{{ activity.email }}</div>
            <div class="text-xs text-gray-500" *ngIf="activity.user?.name">{{ activity.user.name }}</div>
          </td>
          <td>
            <p-tag [severity]="activity.status === 'Success' ? 'success' : 'danger'" [value]="activity.status"></p-tag>
          </td>
          <td>{{ activity.ipAddress || 'N/A' }}</td>
          <td>{{ activity.failureReason || '-' }}</td>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="isAdmin ? 5 : 4" class="text-center p-4">
            No sign-in activity found.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
