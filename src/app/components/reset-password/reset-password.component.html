<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
  <h2>Reset Your Password</h2>

  @if (message) {
    <p style="color: green;">{{ message }}</p>
  }
  @if (error) {
    <p style="color: red; background: #fde8e8; padding: 8px; border-radius: 4px;">{{ error }}</p>
  }

  @if (!success && !tokenMissing) {
    <form (ngSubmit)="onResetPassword()">
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">New Password:</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          minlength="6"
          style="width: 100%; padding: 8px; box-sizing: border-box;"
          />
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px;">Confirm Password:</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          minlength="6"
          style="width: 100%; padding: 8px; box-sizing: border-box;"
          />
      </div>
      <button
        type="submit"
        [disabled]="loading"
        style="background: #27ae60; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px;"
        >
        {{ loading ? 'Resetting...' : 'Submit New Password' }}
      </button>
    </form>
  }

  @if (success || tokenMissing) {
    <p style="margin-top: 15px;">
      <a routerLink="/login" style="color: #2980b9;">Back to Login</a>
    </p>
  }
</div>
