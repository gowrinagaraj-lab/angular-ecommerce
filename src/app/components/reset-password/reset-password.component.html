<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
      <h2>Reset Your Password</h2>
      
      <p *ngIf="message" style="color: green;">{{ message }}</p>
      <p *ngIf="error" style="color: red;">{{ error }}</p>

      <form (ngSubmit)="onResetPassword()" *ngIf="!success">
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px;">New Password:</label>
          <input 
            type="password" 
            [(ngModel)]="password" 
            name="password" 
            required 
            minlength="6"
            style="width: 100%; padding: 8px; box-sizing: border-box;"
          />
        </div>

        <button 
          type="submit" 
          [disabled]="loading" 
          style="background: #27ae60; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px;"
        >
          {{ loading ? 'Resetting...' : 'Submit New Password' }}
        </button>
      </form>
    </div>
