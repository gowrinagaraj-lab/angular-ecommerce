<div class="chatbot-container">
  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen" [class.open]="isOpen">
    <div class="chat-header">
      <div class="header-info">
        <i class="fa-solid fa-robot bot-icon"></i>
        <span>{{ showHistory ? 'Chat History' : 'Shopping Assistant' }}</span>
      </div>
      <div class="header-actions">
        <button class="action-btn" (click)="toggleHistory()" [title]="showHistory ? 'Back to Chat' : 'Conversation History'">
          <i class="fa-solid" [ngClass]="showHistory ? 'fa-message' : 'fa-clock-rotate-left'"></i>
        </button>
        <button class="action-btn" (click)="startNewConversation()" title="New Conversation">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button class="action-btn close-btn" (click)="toggleChat()" title="Close">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
    </div>

    <!-- History View -->
    <div class="chat-history-container" *ngIf="showHistory">
      <div class="history-header">
        <span>Previous Chats</span>
        <button class="btn-new-chat" (click)="startNewConversation()">
          <i class="fa-solid fa-plus"></i> New Chat
        </button>
      </div>

      <div class="history-loading" *ngIf="historyLoading">
        <p>Loading history...</p>
      </div>

      <div class="history-empty" *ngIf="!historyLoading && conversations.length === 0">
        <i class="fa-regular fa-comments empty-icon"></i>
        <p>No chat history found.</p>
      </div>

      <div class="history-list" *ngIf="!historyLoading && conversations.length > 0">
        <div 
          class="history-item" 
          *ngFor="let conv of conversations" 
          [class.active]="(conv._id || conv.id) === conversationId"
          (click)="loadConversation(conv._id || conv.id)"
        >
          <div class="history-item-content">
            <div class="history-item-title">{{ conv.title || 'New conversation' }}</div>
            <div class="history-item-date">{{ conv.updatedAt | date:'mediumDate' }}</div>
          </div>
          <button class="delete-conv-btn" (click)="deleteConversation(conv._id || conv.id, $event)" title="Delete Conversation">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Chat Messages View -->
    <div class="chat-messages" #chatMessagesContainer *ngIf="!showHistory">
      <div class="message-wrapper" *ngFor="let msg of messages" [ngClass]="msg.role">
        <div class="message-content">
          {{ msg.content }}
        </div>
      </div>
      
      <div class="message-wrapper assistant" *ngIf="isLoading">
        <div class="message-content typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area" *ngIf="!showHistory">
      <div class="input-wrapper">
        <input 
          type="text" 
          [(ngModel)]="currentMessage" 
          (keyup.enter)="sendMessage()" 
          placeholder="Type a message..." 
          [disabled]="isLoading"
        />
        <button *ngIf="currentMessage" class="clear-input-btn" (click)="clearInput()" title="Clear input">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <button class="send-btn" (click)="sendMessage()" [disabled]="isLoading || !currentMessage.trim()" title="Send Message">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- Toggle Button -->
  <button class="chat-toggle-btn" (click)="toggleChat()">
    <i class="fa-solid fa-comment-dots" *ngIf="!isOpen"></i>
    <i class="fa-solid fa-times" *ngIf="isOpen"></i>
  </button>
</div>
